[package]
name = "toothless"
version = "0.1.0"
edition = "2024"
description = "A Night Fury that lives in the corner of your Wayland desktop"
license = "MIT"

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
toml = "1"
wayland-client = "0.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
